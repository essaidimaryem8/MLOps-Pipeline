name: ML Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install root dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle pytest -r requirements.txt

      - name: Install ML dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Code Quality
        run: |
          pycodestyle backend/main.py backend/model_pipeline/preprocessing.py backend/model_pipeline/training.py backend/model_pipeline/evaluation.py backend/model_pipeline/io.py tests/test_main.py --max-line-length=120 --ignore=E203,E266,E501,W503

      - name: Run Tests
        run: |
          pytest tests/test_main.py

      - name: Check Data Availability
        id: check-data
        run: |
          if [ -f "data/raw_data/churn-bigml-80.csv" ] && [ -f "data/raw_data/churn-bigml-20.csv" ]; then
            echo "data_available=true" >> $GITHUB_OUTPUT
          else
            echo "data_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Install MLflow for Tracking
        run: |
          pip install mlflow

      - name: Set up MLflow Tracking
        run: |
          mkdir -p mlruns
          chmod -R 755 mlruns
          echo "MLFLOW_TRACKING_URI=file://$(pwd)/mlruns" >> $GITHUB_ENV

      - name: Prepare Data
        if: steps.check-data.outputs.data_available == 'true'
        working-directory: backend
        env:
          DOCKER: false
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MLFLOW_TRACKING_URI: file://./mlruns
        run: |
          python main.py --prepare_data
          mlflow experiments list --experiment-name GBM_Experiment  # Verify tracking

      - name: Train Model
        if: steps.check-data.outputs.data_available == 'true'
        working-directory: backend
        env:
          DOCKER: false
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MLFLOW_TRACKING_URI: file://./mlruns
        run: |
          python main.py --train
          mlflow experiments list --experiment-name GBM_Experiment

      - name: Evaluate Model
        if: steps.check-data.outputs.data_available == 'true'
        working-directory: backend
        env:
          DOCKER: false
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MLFLOW_TRACKING_URI: file://./mlruns
        run: |
          python main.py --evaluate
          mlflow experiments list --experiment-name GBM_Experiment

      - name: Retrain Model (Optional for Excellence)
        if: steps.check-data.outputs.data_available == 'true'
        working-directory: backend
        env:
          DOCKER: false
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MLFLOW_TRACKING_URI: file://./mlruns
        run: |
          python main.py --retrain
          mlflow experiments list --experiment-name GBM_Experiment

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        working-directory: backend
        run: |
          docker buildx build --push -t ${{ secrets.DOCKER_USERNAME }}/ml-pipeline-backend:latest .

      - name: Build and Push Frontend Docker Image
        working-directory: frontend
        run: |
          docker buildx build --push -t ${{ secrets.DOCKER_USERNAME }}/ml-pipeline-frontend:latest .
