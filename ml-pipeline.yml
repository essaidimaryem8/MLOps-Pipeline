name: ML Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle pytest

      - name: Install ML dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Code Quality
        run: |
          pycodestyle backend/main.py backend/model_pipeline.py tests/test_main.py --max-line-length=120 --ignore=E203,E266,E501,W503

      - name: Run Tests
        run: |
          pytest tests/test_main.py

      - name: Prepare Data
        working-directory: backend
        run: |
          python main.py --prepare_data

      - name: Train Model
        working-directory: backend
        run: |
          python main.py --train

      - name: Evaluate Model
        working-directory: backend
        run: |
          python main.py --evaluate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        working-directory: backend
        run: |
          docker buildx build --push -t ${{ secrets.DOCKER_USERNAME }}/ml-project-backend:latest .

      - name: Build and Push Frontend Docker Image
        working-directory: frontend
        run: |
          docker buildx build --push -t ${{ secrets.DOCKER_USERNAME }}/ml-project-frontend:latest .
